project:
  type: website
  output-dir: docs
  # Quarto renders .md files too, which would publish CLAUDE.md as
  # /CLAUDE.html and list it in the sitemap. Restrict to .qmd sources.
  render:
    - "*.qmd"
    - "**/*.qmd"
  post-render:
    - tidy-urls.py

website:
  title: "Noah Schouela"
  description: "Political economy of development — democracy, governance, and Latin American politics."
  site-url: https://noahschouela.com
  navbar:
    left:
      - href: index.qmd
        text: About
      - href: research/index.qmd
        text: Research
      - href: cv/index.qmd
        text: CV
  page-footer:
    center: "© Noah Schouela"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    anchor-sections: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
